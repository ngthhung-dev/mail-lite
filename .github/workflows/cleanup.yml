# Dọn Release cũ: xoá vĩnh viễn mọi Release (kèm tag) trừ Release mới nhất,
# xoá mọi bản build trong mục Artifacts, và xoá lịch sử các lần chạy ở tab Actions
# (trừ chính lần dọn này — đang chạy thì không tự xoá được).
# Tuỳ chọn "xoa_tat_ca" = xoá luôn cả Release mới nhất (khi reset phiên bản).
# Chạy tay: tab Actions → Dọn Release cũ → Run workflow.
name: Dọn Release cũ

on:
  workflow_dispatch:
    inputs:
      xoa_tat_ca:
        description: 'Xoá cả Release mới nhất (dùng khi reset phiên bản)'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Xoá Release cũ và tag
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ALL: ${{ inputs.xoa_tat_ca }}
        run: |
          latest=""
          if [ "$ALL" != "true" ]; then
            latest=$(gh api "repos/$REPO/releases/latest" --jq .tag_name 2>/dev/null || true)
            echo "Giữ lại: $latest"
          else
            echo "Xoá TẤT CẢ Release"
          fi
          gh api "repos/$REPO/releases" --paginate --jq '.[].tag_name' | while read -r tag; do
            [ "$tag" = "$latest" ] && continue
            echo "Xoá Release + tag: $tag"
            gh release delete "$tag" --repo "$REPO" --yes --cleanup-tag
          done
          # tag còn sót không gắn Release nào (trừ tag của Release mới nhất)
          gh api "repos/$REPO/tags" --paginate --jq '.[].name' | while read -r tag; do
            [ "$tag" = "$latest" ] && continue
            echo "Xoá tag lẻ: $tag"
            gh api -X DELETE "repos/$REPO/git/refs/tags/$tag"
          done

      - name: Xoá bản build trong Artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh api "repos/$REPO/actions/artifacts" --paginate --jq '.artifacts[] | "\(.id) \(.name)"' | while read -r id name; do
            echo "Xoá artifact: $name ($id)"
            gh api -X DELETE "repos/$REPO/actions/artifacts/$id"
          done

      - name: Xoá lịch sử các lần chạy
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SELF: ${{ github.run_id }}
        run: |
          gh api "repos/$REPO/actions/runs" --paginate --jq '.workflow_runs[] | "\(.id) \(.status)"' | while read -r id status; do
            [ "$id" = "$SELF" ] && continue
            [ "$status" = "completed" ] || { echo "Bỏ qua lần chạy đang dở: $id"; continue; }
            echo "Xoá lần chạy: $id"
            gh api -X DELETE "repos/$REPO/actions/runs/$id"
          done
