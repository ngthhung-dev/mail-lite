# Build bản cài Mail Lite cho Windows, macOS và Linux trên máy chủ GitHub.
#  - Bấm "Run workflow" ở tab Actions: build xong tải bản cài ở mục Artifacts của lần chạy.
#  - Run workflow có điền ô version (vd. v1.0.1), hoặc đẩy tag v1.0.1: build xong tự tạo Release kèm bản cài.
name: Build bản cài

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Phát hành Release với tag này (vd. v1.0.1). Để trống = chỉ build, tải ở Artifacts.'
        required: false
        default: ''
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            args: --win nsis zip --x64
          - os: macos-latest
            name: macos
            args: --mac dmg zip --x64 --arm64
          - os: ubuntu-latest
            name: linux
            args: --linux deb AppImage --x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cài thư viện
        run: npm ci

      - name: Kiểm tra mã
        run: npm run typecheck

      - name: Build giao diện + lõi
        run: npx electron-vite build

      - name: Đóng gói
        run: npx electron-builder --config electron-builder.config.cjs ${{ matrix.args }}
        env:
          # chưa có chứng chỉ ký số Apple/Windows → bỏ qua bước ký
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Lưu bản cài
        uses: actions/upload-artifact@v4
        with:
          name: Mail-Lite-${{ matrix.name }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.zip
            release/*.dmg
            release/*.deb
            release/*.AppImage

  # Tạo một Release duy nhất sau khi cả ba bản build xong (tránh ba máy cùng tạo Release một lúc)
  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Phát hành
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Mail Lite ${{ inputs.version || github.ref_name }}
          body_path: .github/release-notes.md
          files: |
            dist/*
            docs/Mail-Lite-Huong-dan-su-dung.pdf
