# Build bản cài Mail Lite cho Windows, macOS, Linux và phát hành lên trang Releases.
# Quy ước phiên bản (giống các app khác của ngthhung): mỗi lần chạy tự tăng từ bản phát hành gần nhất
#   1.0.1 → 1.0.2 → … → 1.0.99 → 1.1.0 → … → 1.99.99 → 2.0.0
#   tag      v<phiên bản>                 vd. v1.0.1
#   tiêu đề  Mail Lite <phiên bản>
#   tệp      Mail-Lite-1.0.1-Setup.exe
#            Mail-Lite-1.0.1-macOS-AppleSilicon.pkg
#            Mail-Lite-1.0.1-macOS-Intel.pkg
#            mail-lite_1.0.1_amd64.deb
# Cách chạy: tab Actions → Build bản cài → Run workflow (có thể tự nhập phiên bản).
name: Build bản cài

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Tự nhập phiên bản (vd 1.2.3). Để trống = tự tăng từ bản phát hành gần nhất'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  # Tính phiên bản một lần cho cả bốn bản build
  setup:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Phiên bản kế tiếp
        id: v
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            V="${{ github.event.inputs.version }}"; V="${V#v}"
          else
            # bản gần nhất (bỏ đuôi -buildN của các tag cũ); chưa có thì coi như 1.0.0
            LAST=$(git ls-remote --tags --refs origin 'v*' | sed 's#.*refs/tags/v##; s#-build.*##' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
            LAST=${LAST:-1.0.0}
            IFS=. read -r MA MI PA <<< "$LAST"
            PA=$((PA + 1))
            if [ "$PA" -gt 99 ]; then PA=0; MI=$((MI + 1)); fi
            if [ "$MI" -gt 99 ]; then MI=0; MA=$((MA + 1)); fi
            V="$MA.$MI.$PA"
            echo "Bản gần nhất: $LAST"
          fi
          echo "Phiên bản: $V"
          echo "version=$V" >> "$GITHUB_OUTPUT"

  build:
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            args: --win nsis --x64
            mac_label: ''
          - os: macos-latest
            name: macos-applesilicon
            args: --mac pkg --arm64
            mac_label: AppleSilicon
          - os: macos-latest
            name: macos-intel
            args: --mac pkg --x64
            mac_label: Intel
          - os: ubuntu-latest
            name: linux
            args: --linux deb --x64
            mac_label: ''
    runs-on: ${{ matrix.os }}
    env:
      MAC_LABEL: ${{ matrix.mac_label }}
      APP_VERSION: ${{ needs.setup.outputs.version }}
      # chưa có chứng chỉ ký số Apple/Windows
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cài thư viện
        run: npm ci

      - name: Kiểm tra mã
        run: npm run typecheck

      - name: Build giao diện + lõi
        run: npx electron-vite build

      - name: Đóng gói
        run: npx electron-builder --config electron-builder.config.cjs ${{ matrix.args }}

      - name: Lưu bản cài
        uses: actions/upload-artifact@v4
        with:
          name: Mail-Lite-${{ matrix.name }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.pkg
            release/*.deb

  # Tạo một Release duy nhất sau khi cả bốn bản build xong
  release:
    needs: [setup, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Phát hành
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.setup.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Mail Lite ${{ needs.setup.outputs.version }}
          body_path: .github/release-notes.md
          make_latest: true
          files: dist/*
