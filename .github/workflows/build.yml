# Build bản cài Mail Lite cho Windows, macOS, Linux và phát hành lên trang Releases.
# Quy ước (giống các app khác của ngthhung):
#   tag      v<phiên bản>-build<số build>        vd. v1.0.0-build4
#   tiêu đề  Mail Lite <phiên bản> (build <số>)
#   tệp      Mail-Lite-1.0.0-build4-Setup.exe
#            Mail-Lite-1.0.0-build4-macOS-AppleSilicon.pkg
#            Mail-Lite-1.0.0-build4-macOS-Intel.pkg
#            mail-lite_1.0.0-build4_amd64.deb
# Số build tự tăng mỗi lần chạy (= số lần chạy − BUILD_BASE). Phiên bản lấy từ package.json.
# Cách chạy: tab Actions → Build bản cài → Run workflow.
name: Build bản cài

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  # Số build = số thứ tự lần chạy trừ đi BUILD_BASE (đặt lại về build 1 từ lần chạy thứ 11)
  BUILD_BASE: 10

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            args: --win nsis --x64
            mac_label: ''
          - os: macos-latest
            name: macos-applesilicon
            args: --mac pkg --arm64
            mac_label: AppleSilicon
          - os: macos-latest
            name: macos-intel
            args: --mac pkg --x64
            mac_label: Intel
          - os: ubuntu-latest
            name: linux
            args: --linux deb --x64
            mac_label: ''
    runs-on: ${{ matrix.os }}
    env:
      MAC_LABEL: ${{ matrix.mac_label }}
      # chưa có chứng chỉ ký số Apple/Windows
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4

      - name: Tính số build
        shell: bash
        run: echo "BUILD_NUMBER=$(( ${{ github.run_number }} - BUILD_BASE ))" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cài thư viện
        run: npm ci

      - name: Kiểm tra mã
        run: npm run typecheck

      - name: Build giao diện + lõi
        run: npx electron-vite build

      - name: Đóng gói
        run: npx electron-builder --config electron-builder.config.cjs ${{ matrix.args }}

      - name: Lưu bản cài
        uses: actions/upload-artifact@v4
        with:
          name: Mail-Lite-${{ matrix.name }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.pkg
            release/*.deb

  # Tạo một Release duy nhất sau khi cả bốn bản build xong
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Đọc phiên bản + số build
        id: v
        run: |
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          echo "build=$(( ${{ github.run_number }} - BUILD_BASE ))" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Phát hành
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}-build${{ steps.v.outputs.build }}
          target_commitish: ${{ github.sha }}
          name: Mail Lite ${{ steps.v.outputs.version }} (build ${{ steps.v.outputs.build }})
          body_path: .github/release-notes.md
          make_latest: true
          files: dist/*
